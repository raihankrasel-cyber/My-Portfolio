<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <meta name="description" content="Raihan combines digital marketing with hands-on garment production, quality inspection, and sales experience.">
  <script defer src="/_vercel/insights/script.js"></script>
  <title>Raihan's Portfolio — Digital Marketer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="medium.css">
  <link rel="stylesheet" href="auth.css">
  <script>
    (() => {
      const supported = new Set(["en","bn"]);
      const source = document.documentElement.lang === "bn" ? "bn" : "en";
      let selected = null;
      let explicit = false;
      try {
        const queryChoice = new URLSearchParams(window.location.search).get("lang");
        selected = queryChoice || localStorage.getItem("portfolio-language-choice") || sessionStorage.getItem("portfolio-language-choice");
        explicit = supported.has(selected);
        if (explicit) localStorage.setItem("portfolio-language-choice", selected);
      } catch {}
      if (!supported.has(selected)) selected = source;
      const root = document.documentElement;
      root.dataset.baseLanguage = source;
      root.dataset.siteLanguage = selected;
      root.dataset.hasLanguageChoice = explicit ? "true" : "false";
      root.lang = selected;
      root.dir = "ltr";
      if (selected !== source) root.classList.add("language-pending");
    })();
  </script>
  <link rel="alternate" hreflang="en" href="/?lang=en">
  <link rel="alternate" hreflang="bn" href="/bn.html?lang=bn">
</head>
